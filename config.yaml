# ===== Faceless Shorts Pipeline - settings =====
# API keys go in the .env file, not here.

output_dir: output          # review/, approved/, uploaded/ folders are created inside
fonts_dir: fonts            # run `python run.py fonts` to download every font the pipeline uses

video:
  width: 1080
  height: 1920
  fps: 30
  clip_seconds: 3.0         # how long each stock clip stays on screen (shorter = more variety)
  motion: 0.12              # slow pan across every clip (0 = still). Keeps the picture moving
  strict_footage: true      # only clips whose tags match the search (tops up loosely if too few)
  darken: 0.45              # 0 = no darkening, 1 = black. Keeps captions readable
  script_seconds: [55, 75]  # spoken length Claude aims for (Shorts can be up to 3 minutes)

claude:
  model: claude-sonnet-5-5

elevenlabs:
  model_id: eleven_multilingual_v2   # supports Thai and English

youtube:
  api_verified: false       # set true only after your Google project passes YouTube's API audit (README step 5)
  privacy: private          # unverified projects can only upload private videos
  publish_times: ["12:00", "19:00"]  # local times; each video takes the next free slot
  utc_offset: "+07:00"      # Bangkok
  category_id: "22"         # People & Blogs
  contains_synthetic_media: true     # discloses the AI voice to YouTube

daily_count: 1              # videos per channel per daily run

news:                       # Thai news recaps (สรุปให้ฟัง) - README section 8. Safety rules are in code.
  channel: summed_up
  dir: news                 # news/<date>-<topic>/research.json, script.json, voice
  min_outlets: 2            # a fact needs this many DIFFERENT credible outlets (the rule says 2)
  min_beats: 4
  max_beats: 7
  script_seconds: [60, 90]
  short_seconds: [60, 85]   # news-build --short: a shorter version next to the full one
  max_searches: 10          # web searches per research run
  closing_line: "ติดตามสรุปให้ฟัง เพื่อไม่พลาดเรื่องที่คนพูดถึง"
  disclaimer: "สรุปจากรายงานของสื่อที่ระบุด้านบน ข้อกล่าวหาเป็นเพียงข้อกล่าวหาจนกว่าจะมีคำตัดสิน · เสียงบรรยายโดย AI"
  darken: 0.55
  model_id: eleven_v4       # ElevenLabs model for the news voice (reads Thai better than multilingual_v2)
  pronounce:                # extra words the voice says wrong: "as written": "as spoken" (built-in list in newslib.py)
    "ศปภ.": "สอปอภอ"
  category_id: "25"         # News & Politics
  publish_times: ["12:00", "18:00"]
  footage_exclude: [face, portrait, man, woman, people, crowd, protest, police, flag, logo,
                    person, human, girl, boy, child, family, couple, worker, businessman, pilot,
                    crew, stewardess, passenger, passengers, traveler, tourist, tourists,
                    worried, panic, stress, anxiety, sad, happy, emotion, beard, war, conflict,
                    youtube, subscribe, subscribers, green screen, social media, lovers, fisherman,
                    market, vietnam, japan, turkey, istanbul, ai generated, student, teamwork,
                    collaboration, looking,
                    city, cityscape, skyline, skyscraper, building, buildings, town, village, architecture,
                    landmark, new, york, manhattan, london, paris, europe, tower, bridge, church]
                            # no people, and no recognisable places (a foreign skyline would mislead)
  credible_outlets:         # domain -> outlet name. Only these are searched, and only these count.
    thaipbs.or.th: Thai PBS
    thaipbsworld.com: Thai PBS          # same newsroom - counts as one outlet
    bangkokpost.com: Bangkok Post
    thairath.co.th: Thairath
    matichon.co.th: Matichon
    khaosod.co.th: Khaosod
    khaosodenglish.com: Khaosod         # same newsroom - counts as one outlet
    thestandard.co: The Standard
    prachachat.net: Prachachat
    pptvhd36.com: PPTV
    reuters.com: Reuters
    apnews.com: AP

social:                     # Facebook + Instagram captions for every video (Discord card buttons)
  enabled: true
  handles:                  # your Instagram @handles, used in "follow @..." - leave "" until they exist
    mindset_minute: ""
    storytime_cuts: ""
    candlelit_en: ""
    summed_up: "@สรุปให้ฟังOfficial"
    wonder_minute: ""

automation:                 # used by the Discord bot (bot.py)
  daily_time: "01:30"       # this computer's local time; change from Discord with /settime
  upload_after_approve: true  # tap Approve in Discord -> uploads and schedules right away

story:                      # story-reading mode (python run.py story-...), see README section 7
  channels:                 # language -> channel. Delete a line to stop publishing that language
    en: candlelit_en
    th: candlelit_th
    zh: candlelit_zh
  target_minutes: [15, 90]  # story-check warns when a narration is outside this range
  stories_dir: stories      # one folder per story: source.txt + story.yaml
  translation_words: 1500   # Claude translates in chunks of about this many words
  narration_chunk_chars: 2500   # characters per ElevenLabs request (model limit is higher)
  credits_per_char: 1.0     # ElevenLabs credits per character, for the cost estimate
  model_id: eleven_multilingual_v2
  voice_settings: {stability: 0.55, similarity_boost: 0.8, style: 0.15, speed: 0.9}
                            # speed 0.9 = calmer storytelling, ~10% longer, same credits
  paragraph_pause: 1.0      # seconds of silence between narration chunks
  intro_card_seconds: 4     # channel name + title + author card, after the spoken hook
  outro_card_seconds: 6     # "Subscribe for more stories"
  clip_seconds: 6           # each footage clip stays 6-10 s ...
  crossfade_seconds: 2      # ... with long slow crossfades
  motion: 0.08              # slow drift across every shot (0 = still)
  clips_per_scene: 6        # minimum distinct clips downloaded per scene ...
  clip_every_seconds: 25    # ... plus one more per this many seconds of the scene (max 40)
  footage_exclude: [escalator, office, laptop, computer, keyboard, smartphone, phone, car, cars,
                    traffic, highway, skyscraper, mall, airport, subway, neon, business, technology]
                            # stock clips tagged with any of these are skipped (story videos + trailers)
  darken: 0.35
  music_dir: music          # royalty-free ambience tracks you download (mp3/wav/m4a/ogg/flac)
  music_volume: 0.12        # music level under the voice (it ducks further while the narrator speaks)
  segment_seconds: 150      # render in segments of about this length, then join without re-encoding
  x264_preset: veryfast     # slower = smaller file, longer render
  category_id: "24"         # Entertainment ("1" = Film & Animation)
  publish_times: ["20:00"]  # long videos take the next free slot at these local times
  channel_urls:             # fill in once the channels exist; used in "Also in ..." footers
    candlelit_en: ""
    candlelit_th: ""
    candlelit_zh: ""

channels:

  mindset_minute:
    name: Mindset Minute
    language: en            # en or th
    voice_id: bfGb7JTLUnZebZRiFYyq  # Adam
    font: Anton             # font family name of a file in fonts/  (Thai: Noto Sans Thai)
    caption_color: "#F2C14E"
    highlight_color: "#FFFFFF"
    youtube_token: tokens/mindset_minute.json
    footage_hint: cinematic city, sunrise, focused person, office desk, money, running, mountains
    hashtags: ["#mindset", "#money", "#selfimprovement", "#shorts"]
    description_footer: "Follow Mindset Minute for one lesson a day."
    style: |
      One practical lesson about money, habits, discipline or mindset.
      Open with a hook that challenges a common belief in under 10 words.
      Give one clear idea and one concrete action the viewer can take today.
      Use plain, punchy sentences. No made-up statistics, no fake quotes, no
      financial product recommendations. End with: "Follow for one lesson a day."

  storytime_cuts:
    name: Storytime Cuts
    language: en
    voice_id: DODLEQrClDo8wCz460ld  # Lauren
    font: Anton
    caption_color: "#F5E9FF"
    highlight_color: "#FFB86B"
    youtube_token: tokens/storytime_cuts.json
    footage_hint: night city, rain on window, phone screen, empty street, apartment, mysterious hallway
    hashtags: ["#storytime", "#story", "#shorts"]
    description_footer: "This is a fictional story. Follow Storytime Cuts for more."
    style: |
      An ORIGINAL short fictional story told in first person, with a surprising
      twist. Open with an intriguing first line that creates a question. Keep
      tension rising; reveal the twist in the final lines. About real-feeling
      everyday situations (neighbors, wrong texts, strange coincidences).
      No violence or gore. Sometimes end with "Follow for part 2."

  wonder_minute:
    name: Wonder Minute
    language: en
    voice_id: nPczCjzI2devNBz1zQrb  # Brian - deep, warm narrator (ElevenLabs default voice)
    font: Anton
    caption_color: "#FFFFFF"
    highlight_color: "#3DDCFF"
    youtube_token: tokens/wonder_minute.json
    footage_hint: ocean, deep sea, space, galaxy, volcano, jungle, wild animals, microscope, aurora
    clips_per_keyword: 6      # mostly footage of the video's subject; the hint above is only backup
    footage_match: subject    # a clip must be TAGGED with the keyword's first word (octopus, not "underwater")
    footage_exclude: [ai generated, cartoon, animation, fantasy, monster, alien, kraken,
                      illustration, drawing, game, toy, person, man, woman, people, face, fair,
                      fairground, carousel, festival, seafood, food, restaurant, diver, surfer,
                      statue, statues, sculpture, sculptures, museum, fountain, monument, garden,
                      church, religion, god, goddess, greek, roman, marble, artwork, nude]
    hashtags: ["#facts", "#amazing", "#didyouknow", "#shorts"]
    description_footer: "Follow Wonder Minute for one amazing fact a day."
    style: |
      ONE amazing, true fact about nature, animals, space, the ocean, the human body,
      earth, history or engineering - the kind that makes people say "wait, what?".
      Open with the most surprising part in under 10 words. Then explain how / why it
      happens in plain words, with one vivid comparison people can picture. Only
      well-documented facts you are certain of: no made-up numbers, no myths, no
      "scientists say" without substance, no exaggeration. End with:
      "Follow for one amazing fact a day."
      Footage keywords: start EVERY keyword with the main subject as one plain noun, then what
      it does (e.g. "octopus swimming", "octopus close up", "octopus camouflage") - 4 of the 5
      keywords about the subject itself.
    # "Popular ideas": most-viewed recent Shorts for these searches -> original topic ideas
    auto_upload: true         # no review step: uploads (private) right after it is made
    trend_queries: ["amazing facts", "did you know facts", "mind blowing facts", "animal facts",
                    "space facts", "ocean facts"]
    trend_days: 30

  # ---------- story-reading channels (story mode only - not used by the daily Shorts run) ----------

  candlelit_en:
    name: Candlelit Tales
    type: story
    language: en
    voice_id: JBFqnCBsd6RMkjVDRZzb        # George - warm, captivating British storyteller
    font: Noto Sans                       # subtitles + trailer captions
    title_font: Cinzel                    # intro card + thumbnail
    bg_color: "#15110E"
    caption_color: "#F3E6C8"              # text
    highlight_color: "#F2A541"            # accent
    youtube_token: tokens/candlelit_en.json
    footage_hint: candlelight, foggy forest, old house at night, moonlit clouds, fireplace
    hashtags: ["#story", "#audiobook", "#classicstories", "#bedtimestories"]
    description_footer: "Also in English / ภาษาไทย / 中文"

  candlelit_th:
    name: นิทานใต้แสงเทียน
    type: story
    language: th
    voice_id: PASTE_ELEVENLABS_VOICE_ID
    font: Noto Sans Thai
    title_font: Chonburi
    bg_color: "#3A0D14"
    caption_color: "#F3E6C8"
    highlight_color: "#F2A541"
    youtube_token: tokens/candlelit_th.json
    footage_hint: candlelight, foggy forest, old house at night, moonlit clouds, fireplace
    hashtags: ["#นิทาน", "#เรื่องเล่า", "#หนังสือเสียง", "#เรื่องสั้น"]
    description_footer: "Also in English / ภาษาไทย / 中文"

  candlelit_zh:
    name: 烛光夜话
    type: story
    language: zh
    voice_id: PASTE_ELEVENLABS_VOICE_ID
    font: Noto Sans SC
    title_font: Noto Serif SC
    bg_color: "#0F1F1C"
    caption_color: "#F3E6C8"
    highlight_color: "#F2A541"
    youtube_token: tokens/candlelit_zh.json
    footage_hint: candlelight, foggy forest, old house at night, moonlit clouds, fireplace
    hashtags: ["#故事", "#有声书", "#经典故事", "#睡前故事"]
    description_footer: "Also in English / ภาษาไทย / 中文"

  # ---------- Thai news recaps (made with news-research / news-build, never by the daily run) ----------

  summed_up:
    name: สรุปให้ฟัง
    type: news
    language: th
    handle: "@สรุปให้ฟังOfficial"
    voice_id: B4NdgwdU97lHqA8Udh2D        # Kanya - warm, calm Thai narrator (Voice Library)
    font: Kanit                           # card text + captions (Kanit Bold)
    title_font: Kanit ExtraBold           # titles, date pills, channel name
    bg_color: "#0E2A47"
    caption_color: "#FFFFFF"              # text
    highlight_color: "#FFD60A"            # accent: date pills, dots, current caption word
    latest_color: "#E63946"               # the "ล่าสุด" (latest) dot and pill
    youtube_token: tokens/summed_up.json
    footage_hint: rain on window, water surface, phone screen scrolling, documents on desk, weather radar map, abstract data
    hashtags: ["#สรุปข่าว", "#สรุปดราม่า", "#สรุปให้ฟัง", "#shorts"]
    description_footer: "ติดตามสรุปให้ฟัง เพื่อไม่พลาดเรื่องที่คนพูดถึง"
