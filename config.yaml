# ===== Faceless Shorts Pipeline - settings =====
# API keys go in the .env file, not here.

output_dir: output          # review/, approved/, uploaded/ folders are created inside
fonts_dir: fonts            # run `python run.py fonts` to download every font the pipeline uses

video:
  width: 1080
  height: 1920
  fps: 30
  clip_seconds: 4.5         # how long each stock clip stays on screen
  darken: 0.45              # 0 = no darkening, 1 = black. Keeps captions readable

claude:
  model: claude-sonnet-5-5

elevenlabs:
  model_id: eleven_multilingual_v2   # supports Thai and English

youtube:
  api_verified: false       # set true only after your Google project passes YouTube's API audit (README step 5)
  privacy: private          # unverified projects can only upload private videos
  publish_times: ["12:00", "19:00"]  # local times; each video takes the next free slot
  utc_offset: "+07:00"      # Bangkok
  category_id: "22"         # People & Blogs
  contains_synthetic_media: true     # discloses the AI voice to YouTube

daily_count: 1              # videos per channel per daily run

automation:                 # used by the Discord bot (bot.py)
  daily_time: "01:30"       # this computer's local time; change from Discord with /settime
  upload_after_approve: true  # tap Approve in Discord -> uploads and schedules right away

story:                      # story-reading mode (python run.py story-...), see README section 7
  channels:                 # language -> channel. Delete a line to stop publishing that language
    en: candlelit_en
    th: candlelit_th
    zh: candlelit_zh
  target_minutes: [15, 60]  # story-check warns when a narration is outside this range
  stories_dir: stories      # one folder per story: source.txt + story.yaml
  translation_words: 1500   # Claude translates in chunks of about this many words
  narration_chunk_chars: 2500   # characters per ElevenLabs request (model limit is higher)
  credits_per_char: 1.0     # ElevenLabs credits per character, for the cost estimate
  model_id: eleven_multilingual_v2
  voice_settings: {stability: 0.55, similarity_boost: 0.8, style: 0.15}
  paragraph_pause: 0.6      # seconds of silence between narration chunks
  intro_card_seconds: 4     # channel name + title + author card, after the spoken hook
  outro_card_seconds: 6     # "Subscribe for more stories"
  clip_seconds: 8           # each footage clip stays 6-10 s ...
  crossfade_seconds: 2.5    # ... with long slow crossfades
  clips_per_scene: 6        # distinct clips downloaded per scene (reused with different offsets)
  darken: 0.35
  music_dir: music          # royalty-free ambience tracks you download (mp3/wav/m4a/ogg/flac)
  music_volume: 0.12        # music level under the voice (it ducks further while the narrator speaks)
  segment_seconds: 150      # render in segments of about this length, then join without re-encoding
  x264_preset: veryfast     # slower = smaller file, longer render
  category_id: "24"         # Entertainment ("1" = Film & Animation)
  publish_times: ["20:00"]  # long videos take the next free slot at these local times
  channel_urls:             # fill in once the channels exist; used in "Also in ..." footers
    candlelit_en: ""
    candlelit_th: ""
    candlelit_zh: ""

channels:

  mindset_minute:
    name: Mindset Minute
    language: en            # en or th
    voice_id: bfGb7JTLUnZebZRiFYyq  # Adam
    font: Anton             # font family name of a file in fonts/  (Thai: Noto Sans Thai)
    caption_color: "#F2C14E"
    highlight_color: "#FFFFFF"
    youtube_token: tokens/mindset_minute.json
    footage_hint: cinematic city, sunrise, focused person, office desk, money, running, mountains
    hashtags: ["#mindset", "#money", "#selfimprovement", "#shorts"]
    description_footer: "Follow Mindset Minute for one lesson a day."
    style: |
      One practical lesson about money, habits, discipline or mindset.
      Open with a hook that challenges a common belief in under 10 words.
      Give one clear idea and one concrete action the viewer can take today.
      Use plain, punchy sentences. No made-up statistics, no fake quotes, no
      financial product recommendations. End with: "Follow for one lesson a day."

  storytime_cuts:
    name: Storytime Cuts
    language: en
    voice_id: DODLEQrClDo8wCz460ld  # Lauren
    font: Anton
    caption_color: "#F5E9FF"
    highlight_color: "#FFB86B"
    youtube_token: tokens/storytime_cuts.json
    footage_hint: night city, rain on window, phone screen, empty street, apartment, mysterious hallway
    hashtags: ["#storytime", "#story", "#shorts"]
    description_footer: "This is a fictional story. Follow Storytime Cuts for more."
    style: |
      An ORIGINAL short fictional story told in first person, with a surprising
      twist. Open with an intriguing first line that creates a question. Keep
      tension rising; reveal the twist in the final lines. About real-feeling
      everyday situations (neighbors, wrong texts, strange coincidences).
      No violence or gore. Sometimes end with "Follow for part 2."

  # ---------- story-reading channels (story mode only - not used by the daily Shorts run) ----------

  candlelit_en:
    name: Candlelit Tales
    type: story
    language: en
    voice_id: JBFqnCBsd6RMkjVDRZzb        # George - warm, captivating British storyteller
    font: Noto Sans                       # subtitles + trailer captions
    title_font: Cinzel                    # intro card + thumbnail
    bg_color: "#15110E"
    caption_color: "#F3E6C8"              # text
    highlight_color: "#F2A541"            # accent
    youtube_token: tokens/candlelit_en.json
    footage_hint: candlelight, foggy forest, old house at night, moonlit clouds, fireplace
    hashtags: ["#story", "#audiobook", "#classicstories", "#bedtimestories"]
    description_footer: "Also in English / ภาษาไทย / 中文"

  candlelit_th:
    name: นิทานใต้แสงเทียน
    type: story
    language: th
    voice_id: PASTE_ELEVENLABS_VOICE_ID
    font: Noto Sans Thai
    title_font: Chonburi
    bg_color: "#3A0D14"
    caption_color: "#F3E6C8"
    highlight_color: "#F2A541"
    youtube_token: tokens/candlelit_th.json
    footage_hint: candlelight, foggy forest, old house at night, moonlit clouds, fireplace
    hashtags: ["#นิทาน", "#เรื่องเล่า", "#หนังสือเสียง", "#เรื่องสั้น"]
    description_footer: "Also in English / ภาษาไทย / 中文"

  candlelit_zh:
    name: 烛光夜话
    type: story
    language: zh
    voice_id: PASTE_ELEVENLABS_VOICE_ID
    font: Noto Sans SC
    title_font: Noto Serif SC
    bg_color: "#0F1F1C"
    caption_color: "#F3E6C8"
    highlight_color: "#F2A541"
    youtube_token: tokens/candlelit_zh.json
    footage_hint: candlelight, foggy forest, old house at night, moonlit clouds, fireplace
    hashtags: ["#故事", "#有声书", "#经典故事", "#睡前故事"]
    description_footer: "Also in English / ภาษาไทย / 中文"
